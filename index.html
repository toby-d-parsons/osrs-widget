<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>tr('osrs-widget')</title>
  <script src="config.js"></script>
  <script src="main.js"></script>
  <link rel="icon" type="image/svg+xml" href="resources/icon.svg">
  <link rel="stylesheet" href="styles/main.css">
  <meta name="x-icue-property" content="headline"
        data-label="tr('Headline')"
        data-type="textfield"
        data-default="tr('osrs-widget')">

  <meta name="x-icue-property" content="showSubtitle"
        data-label="tr('Show Subtitle')"
        data-type="switch"
        data-default="true">

  <meta name="x-icue-property" content="subtitle"
        data-label="tr('Subtitle')"
        data-type="textfield"
        data-default="tr('Hello World')">

  <meta name="x-icue-property" content="textColor"
        data-label="tr('Text Color')"
        data-type="color"
        data-default="'#FFFFFF'">

  <meta name="x-icue-property" content="accentColor"
        data-label="tr('Accent Color')"
        data-type="color"
        data-default="'#7C3AED'">

  <meta name="x-icue-property" content="backgroundColor"
        data-label="tr('Background')"
        data-type="color"
        data-default="'#111111'">

  <meta name="x-icue-property" content="transparency"
        data-label="tr('Transparency')"
        data-type="slider"
        data-default="100"
        data-min="0"
        data-max="100"
        data-step="1">

  <meta name="x-icue-property" content="showStats"
        data-label="tr('Show Stats')"
        data-type="switch"
        data-default="true">

  <meta name="x-icue-property" content="showBosses"
        data-label="tr('Show Bosses')"
        data-type="switch"
        data-default="true">

  <script type="application/json" id="x-icue-groups">
  [
    {"title": "tr('Layout')", "properties": ["headline", "showSubtitle", "subtitle", "showStats", "showBosses"]},
    {"title": "tr('Widget Personalization')", "properties": ["textColor", "accentColor", "backgroundColor", "transparency"]}
  ]
  </script>
</head>
<body>
  <div id="content">
    <div id="toolbar">
      <div id="user">--</div>
      <div id="combat-container">
        <img id="combat-icon" src="resources/skill_icons/combat.png"></img>
        <div id="combat-level">--</div>
      </div>
      <div id="total-container">
        <img id="total-icon" src="resources/skill_icons/total.png"></img>
        <div id="total-level">--</div>
      </div>
      <div id="accent"></div>
      <div id="headline">osrs-widget</div>
      <div id="last-updated-container">
        <div id="last-updated-text">00:00</div>
        <button id="last-updated-icon">Refresh</button>
      </div>
    </div>
    <div class="stats-container">
      <p1 id="skills"></p1>
      <p1 id="bosses"></p1>
    </div>
  </div>
  
  <template id="skills-template">
    <div class="skill-container">
      <button type="button" class="skill-button-container">
        <div class="icon-container">
          <img class="skill-icon"></img>
        </div>
        <div class="skill-level">--</div>
      </button>
    </div>
  </template>

  <template id="bosses-template">
    <div class="boss-container">
      <button type="button" class="boss-button-container">
        <div class="icon-container">
          <img class="boss-icon"></img>
        </div>
        <div class="boss-score">--</div>
      </button>
    </div>
  </template>

  <script>
    icueEvents = {
      "onICUEInitialized": init,
      "onDataUpdated": update
    };

    function init() {
      update();
    }

    function update() {
      const currentHeadline = typeof headline !== 'undefined' ? headline : 'osrs-widget';
      const currentTextColor = typeof textColor !== 'undefined' ? textColor : '#FFFFFF';
      const currentAccentColor = typeof accentColor !== 'undefined' ? accentColor : '#7C3AED';
      const currentBackgroundColor = typeof backgroundColor !== 'undefined' ? backgroundColor : '#111111';
      const currentTransparency = typeof transparency !== 'undefined' ? transparency : 100;

      document.documentElement.style.setProperty('--text-color', currentTextColor);
      document.documentElement.style.setProperty('--accent-color', currentAccentColor);
      document.documentElement.style.setProperty('--bg-color', currentBackgroundColor);
      document.documentElement.style.setProperty('--bg-opacity', String(currentTransparency / 100));

      document.getElementById('headline').textContent = currentHeadline;

      const skills = document.getElementById("skills");
        if(showStats) {
            skills.style.display = "flex";
        } else {
            skills.style.display = "none";
      }

      const bosses = document.getElementById("bosses");
        if(showBosses) {
            bosses.style.display = "flex";
        } else {
            bosses.style.display = "none";
      }
    }

    if (typeof iCUE_initialized !== 'undefined' && iCUE_initialized) {
      init();
    }
  </script>
</body>
</html>
